name: dream_catcher
description: "Dream Catcher - Social Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  get_it: ^8.0.3
  dartz: ^0.10.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  flutter_svg: ^2.2.0
  logger: ^2.5.0
  font_awesome_flutter: ^10.9.1
  # Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Supabase (sole backend — no Firebase)
  supabase_flutter: ^2.8.1
  # Media picking for posts
  image_picker: ^1.1.2
  mime: ^1.0.6
  http: ^1.2.2
  # Opening external links
  url_launcher: ^6.3.2
  # Share posts (count + native share sheet)
  share_plus: ^10.1.4
  # Caching network images
  cached_network_image: ^3.4.1
  # Timestamps (e.g. "2 hours ago")
  timeago: ^3.7.0
  # UUID generation for post/comment IDs
  uuid: ^4.5.1
  # Runtime permissions request (Camera, Photos, Storage, Notifications)
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
